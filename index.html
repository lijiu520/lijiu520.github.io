<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Roblox私服直跳（私有服专用）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}
body{background:#14141f;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#1e1e2f;padding:35px;border-radius:14px;width:100%;max-width:520px;box-shadow:0 0 30px #0008;}
h2{text-align:center;margin-bottom:25px;color:#b0c4ff;}
input{width:100%;padding:15px;border-radius:8px;border:none;background:#2b2b40;color:#fff;font-size:15px;outline:none;}
.auto-jump{
margin-top: 14px;
display: flex;
align-items: center;
gap: 8px;
color: #ccc;
font-size: 14px;
cursor: pointer;
}
.auto-jump input[type="checkbox"]{
width: auto;
cursor: pointer;
accent-color: #5865f2;
}
button{width:100%;margin-top:18px;padding:15px;border-radius:8px;border:none;background:#5865f2;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;}
button:hover{background:#4752d8;}
.tip{margin-top:16px;font-size:13px;color:#aaa;text-align:center;word-break:break-all;}
</style>
</head>
<body>
<div class="card">
<h2>Roblox私服直跳（免登录）</h2>
<input id="linkInput" placeholder="粘贴share码或privateServer链接" />
<div class="auto-jump">
<input type="checkbox" id="autoJumpToggle">
<label for="autoJumpToggle">输入有效链接自动跳转</label>
</div>
<button onclick="go()">一键进服</button>
<div class="tip" id="tip"></div>
</div>
<script>
function getJumpInfo(input) {
    // 优先使用标准URL API解析（准确率最高）
    try {
        const urlObj = new URL(input);
        // 仅允许roblox.com及其子域名
        if (!urlObj.hostname.endsWith('roblox.com')) {
            return { valid: false };
        }

        const path = urlObj.pathname;
        const params = urlObj.searchParams;

        // 匹配分享链接 /share 或 /share-links
        if (path === '/share' || path === '/share-links') {
            const code = params.get('code');
            const linkType = params.get('type') || 'Server';
            if (!code) return { valid: false };

            return {
                valid: true,
                href: `roblox://navigation/share_links?code=${encodeURIComponent(code)}&type=${encodeURIComponent(linkType)}`,
                tip: linkType === 'ExperienceInvite' ? "✅ 唤起Roblox（公服分享邀请）..." : "✅ 唤起Roblox（服务器分享）..."
            };
        }

        // 匹配私有服链接 /games/xxx/...
        if (path.includes('/games/')) {
            // 从路径中精准提取placeId，避免正则误匹配
            const pathParts = path.split('/').filter(Boolean);
            const gamesIndex = pathParts.indexOf('games');
            const placeId = pathParts[gamesIndex + 1];
            // 兼容参数大小写变体
            const linkCode = params.get('privateServerLinkCode') || params.get('privateserverlinkcode');

            if (placeId && linkCode) {
                return {
                    valid: true,
                    href: `roblox://experiences/start?placeId=${placeId}&linkCode=${linkCode}`,
                    tip: "✅ 唤起Roblox（私有服）..."
                };
            }
        }

        // 是Roblox域名但不支持的链接类型
        return { valid: false };
    } catch (e) {
        // URL解析失败，降级为正则匹配，兼容仅粘贴短码的场景
    }

    // ---------- 正则兼容模式（短码/不完整链接） ----------
    const shareMatch = input.match(/code=([0-9a-zA-Z_]+)/i);
    const typeMatch = input.match(/type=([a-zA-Z]+)/i);
    const privateCodeMatch = input.match(/privateServerLinkCode=(\d+)/i);
    const placeMatch = input.match(/games\/(\d+)/i);

    if (shareMatch) {
        const code = shareMatch[1];
        const linkType = typeMatch ? typeMatch[1] : 'Server';
        return {
            valid: true,
            href: `roblox://navigation/share_links?code=${encodeURIComponent(code)}&type=${encodeURIComponent(linkType)}`,
            tip: linkType === 'ExperienceInvite' ? "✅ 唤起Roblox（公服分享邀请）..." : "✅ 唤起Roblox（服务器分享）..."
        };
    }

    if (privateCodeMatch && placeMatch) {
        return {
            valid: true,
            href: `roblox://experiences/start?placeId=${placeMatch[1]}&linkCode=${privateCodeMatch[1]}`,
            tip: "✅ 唤起Roblox（私有服）..."
        };
    }

    return { valid: false };
}

function go(){
    const url = document.getElementById("linkInput").value.trim();
    const tip = document.getElementById("tip");
    const start = performance.now();
    const info = getJumpInfo(url);

    if (info.valid) {
        tip.innerText = info.tip;
        window.location.href = info.href;
        const ms = (performance.now() - start).toFixed(2);
        tip.innerText += ` 用时：${ms} ms`;
    } else {
        tip.innerText = "❌ 链接无效，请复制完整Roblox分享/私有服链接";
    }
}

// 自动跳转防抖
let autoJumpTimer = null;
document.getElementById("linkInput").addEventListener("input", function() {
    const toggle = document.getElementById("autoJumpToggle");
    if (!toggle.checked) return;

    clearTimeout(autoJumpTimer);
    const inputVal = this.value.trim();
    if (!inputVal) return;

    autoJumpTimer = setTimeout(() => {
        const info = getJumpInfo(inputVal);
        if (info.valid) go();
    }, 100);
});
</script>
</body>
</html>
