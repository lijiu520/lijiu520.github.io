<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Roblox私服直跳（兼容两种链接）</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}
    body{background:#14141f;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{background:#1e1e2f;padding:35px;border-radius:14px;width:100%;max-width:520px;box-shadow:0 0 30px #0008;}
    h2{text-align:center;margin-bottom:25px;color:#b0c4ff;}
    input{width:100%;padding:15px;border-radius:8px;border:none;background:#2b2b40;color:#fff;font-size:15px;outline:none;}
    button{width:100%;margin-top:18px;padding:15px;border-radius:8px;border:none;background:#5865f2;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:0.2s;}
    button:hover{background:#4752d8;}
    .tip{margin-top:16px;font-size:13px;color:#aaa;text-align:center;word-break:break-all;}
</style>
</head>
<body>
<div class="card">
    <h2>Roblox私服直跳</h2>
    <input id="linkInput" placeholder="粘贴share码或privateServer链接" />
    <button onclick="go()">一键进服</button>
    <div class="tip" id="tip"></div>
</div>

<script>
function go(){
    let url = document.getElementById("linkInput").value.trim();
    let tip = document.getElementById("tip");

    // 同时匹配两种私服码
    const codeMatch = url.match(/code=([0-9a-zA-Z]+)/);
    const privateMatch = url.match(/privateServerLinkCode=([0-9]+)/);

    if (privateMatch) {
        // 私有服 → 跳官方游戏页（最稳定）
        tip.innerText = "✅ 打开游戏页面...";
        window.location.href = "https://www.roblox.com/games/15532962292/Sols-RNG";
    } else if (codeMatch) {
        // 分享服 → 唤醒客户端
        tip.innerText = "✅ 正在唤起Roblox...";
        window.location.href = `roblox://navigation/share_links?code=${codeMatch[1]}&type=Server`;
    } else {
        tip.innerText = "❌ 链接无效，请检查";
    }
}
</script>
</body>
</html>
